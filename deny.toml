# cargo-deny: the supply-chain gate CI runs on every push (see ci.yml).
# Every user runs this binary, and the self-updater swaps it in place, so a
# vulnerable or unexpectedly-licensed dependency is a release blocker.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# RustSec advisories: vulnerabilities fail; unmaintained/unsound are
# reported for workspace-direct deps only so a transitive notice doesn't
# block a release we can't fix.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Everything here is compatible with shipping an MIT binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path deps inside the workspace carry no version requirement to check.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
