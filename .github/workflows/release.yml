# Tag builds: push a `v*` tag and this publishes a GitHub release carrying
# the binary the self-updater (modules/update.rs) looks for. The asset name
# must stay `omarchy-studio-linux-x86_64` — update::ASSET matches on it.
#
# Manual backfill for an existing tag whose release has no asset:
#   gh workflow run release.yml -f tag=v0.8.6
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build and attach the binary to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build + publish binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The binary reports CARGO_PKG_VERSION (TUI header, --version, and the
      # self-updater's CURRENT). A tag that doesn't match Cargo.toml ships a
      # binary that lies about itself and self-updates forever — refuse it.
      - name: Check tag matches crate version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "tag $tag != workspace version $crate — bump Cargo.toml first" >&2
            exit 1
          fi

      # The AUR package can only ever track a released tag, so it's checked
      # here rather than in CI (where Cargo.toml legitimately runs ahead).
      # It drifted to pkgver=0.0.1 against a tag that never existed once.
      - name: Check the AUR package tracks the previous release
        run: |
          pkg=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD | head -1)
          src=$(sed -n 's/^\tpkgver = //p' packaging/aur/.SRCINFO | head -1)
          if [ "$pkg" != "$src" ]; then
            echo "PKGBUILD ($pkg) and .SRCINFO ($src) disagree — run tools/refresh-pkgbuild.sh" >&2
            exit 1
          fi
          # The script takes a bare version, not the tag — it builds the URL
          # as v$ver, so passing the tag asks GitHub for vv0.9.1 and 404s.
          echo "AUR package currently at v$pkg; after this release run:"
          echo "  tools/refresh-pkgbuild.sh ${tag#v}"
        env:
          tag: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust (pinned, matches CI)
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage asset
        run: cp target/release/omarchy-studio omarchy-studio-linux-x86_64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: omarchy-studio-linux-x86_64
          generate_release_notes: true
